name: Windows application candidate

on:
  workflow_dispatch:
    inputs:
      upload_candidate:
        description: 'Upload binaries only after legal/runtime review in distribution/legal/app'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check optional publication materials before building
        if: ${{ inputs.upload_candidate }}
        run: |
          test -s distribution/legal/app/REVIEWED.md
          echo 'Maintainer requested binary artifact publication; this is not a Release.'
      - name: Install the tested Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --target x86_64-pc-windows-msvc
      - name: Record build environment
        run: |
          mkdir -p .ci-reports
          rustc +1.97.1 --version --verbose > .ci-reports/toolchain.txt
          cargo +1.97.1 --version >> .ci-reports/toolchain.txt
          git rev-parse HEAD > .ci-reports/commit.txt
      - name: Test preparation and packaging tools
        run: |
          python -m unittest discover -s crates/board-hwr -p test_prepare_texteller_int8.py -v > .ci-reports/python-prepare.txt 2>&1
          python -m unittest discover -s crates/board-hwr/examples -p test_neural_benchmark_runner.py -v > .ci-reports/python-benchmark.txt 2>&1
          python -m unittest discover -s scripts -p test_package_candidate.py -v > .ci-reports/python-package.txt 2>&1
      - name: Run windowless workspace tests
        run: cargo +1.97.1 test --workspace --locked > .ci-reports/workspace-tests.txt 2>&1
      - name: Build Windows applications
        run: cargo +1.97.1 build --release -p neo-drawing -p neo-blackboard --locked > .ci-reports/build.txt 2>&1
      - name: Verify version without opening windows
        run: |
          target/release/neo-drawing.exe --version 2> .ci-reports/drawing-version.txt
          target/release/neo-blackboard.exe --version 2> .ci-reports/blackboard-version.txt
      - name: Record hashes and package limitations
        run: |
          python -c "import hashlib,json,pathlib; root=pathlib.Path('target/release'); files=[root/n for n in ['neo-drawing.exe','neo-blackboard.exe','DirectML.dll'] if (root/n).is_file()]; rows=[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest()} for p in files]; pathlib.Path('.ci-reports/files.json').write_text(json.dumps({'files':rows,'runtime_completeness_verified':False,'gui_acceptance':False,'contains_models':False},indent=2),encoding='utf-8')"
      - name: Assemble explicitly approved binary candidate
        if: ${{ inputs.upload_candidate }}
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p release-artifacts
          python scripts/package_candidate.py --kind app --input-dir target/release --output-dir release-artifacts/app --legal-dir distribution/legal/app --commit "$BUILD_COMMIT"
      - name: Upload reports only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-app-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload approved application candidate
        if: ${{ success() && inputs.upload_candidate }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-app-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/app/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
